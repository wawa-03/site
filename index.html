<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2f2ef">
  <meta name="description" content="三禹的个人网站。一格一周，记录从 2002 年至今的人生。做 AI 工作流，也写营销文案，正在路上。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="三禹">
  <meta property="og:description" content="一格一周，记录从 2002 年至今的人生。">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230a0a0a'/%3E%3Crect%20x='17'%20y='17'%20width='30'%20height='30'%20rx='8'%20fill='%23ecece5'/%3E%3C/svg%3E">
  <title>三禹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="data.js"></script>
  <style>
    /* V0.23：居中单栏（ianneo 式）、hero 句删除、RECORDS → MOMENTS 单条翻页器。
       V0.22：一年一屏、刻度尺退役、hover 降噪。V0.18：中性黑白灰。 */
    :root{
      color-scheme:dark;--bg:#0a0a0a;--text:#e8e8e2;
      --secondary:#9a9a9a;--muted:#6e6e6e;--pitch:44px;
      --h0:#1a2423;--h1:#525252;--h2:#6e6e6e;--h3:#8b8b8b;--h4:#a9a9a9;--h5:#c9c9c9;--h6:#ececec;
      --panel:#121211;--panel-line:#2e2e2c;--hover-bg:#1a1a19;--hover-dot:#4c4c4a;
      --tip-bg:#f0f0e8;--tip-fg:#111;--sel-bg:#3d3d3a;--sel-fg:#f2f2ec;
      --flash-from:#ffffff;--glow:255,255,255;--hover-text:#c9c9c9;--frame-ink:#1d1d1d;
    }
    html[data-theme="light"]{
      color-scheme:light;--bg:#f2f2ef;--text:#121210;
      --secondary:#3b3b3b;--muted:#8a8a8a;
      --h0:#d7e8e5;--h1:#c8c8c8;--h2:#b2b2b2;--h3:#989898;--h4:#7c7c7c;--h5:#5e5e5e;--h6:#3a3a3a;
      --panel:#fafaf8;--panel-line:#d9d9d4;--hover-bg:#e6e6e1;--hover-dot:#b5b5ae;
      --tip-bg:#1d1d1b;--tip-fg:#f2f2ec;--sel-bg:#cfcfc8;--sel-fg:#1d1d1b;
      --flash-from:#1d1d1b;--glow:0,0,0;--hover-text:#000000;--frame-ink:#d9d9d3;
    }
    *{box-sizing:border-box}
    html{background:var(--bg);scrollbar-width:none}
    html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
    body{
      margin:0;color:var(--text);
      font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      -webkit-font-smoothing:antialiased;
      transition:background .25s,color .25s;
    }
    ::selection{background:var(--sel-bg);color:var(--sel-fg)}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:1px solid #d5d5cf;outline-offset:4px}
    .page{max-width:520px;margin:0 auto;padding:80px 24px 88px}
    h1{font-size:15px;letter-spacing:.14em;font-weight:500;margin:0}
    .who p{font-size:13px;line-height:2;color:var(--secondary);margin:16px 0 0}
    section{margin-top:72px}
    section>h2{font-size:10px;font-weight:400;letter-spacing:.12em;color:var(--muted);margin:0 0 24px;text-align:center}
    .navbtn{
      border:0;background:none;color:var(--muted);font-size:15px;
      cursor:pointer;padding:5px 12px;border-radius:7px;
      transition:color .15s,background .15s;
    }
    .navbtn:hover:not(:disabled),.navbtn:focus-visible{color:var(--text);background:var(--hover-bg)}
    .navbtn:disabled{opacity:.25;cursor:default}
    .counter{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.08em}
    .pager{display:flex;align-items:center;justify-content:center;gap:20px}
    .topline{display:flex;justify-content:space-between;align-items:center}
    .edit-link{display:flex;text-decoration:none}
    .edit-link svg{width:17px;height:17px;display:block;stroke:var(--muted);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
    .edit-link:hover svg,.edit-link:focus-visible svg{stroke:var(--text)}
    .moon-badge svg{width:19px;height:19px;display:block;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .moon-badge{display:flex;text-decoration:none}
    .moon-badge .icon-moon{display:block;transition:stroke .25s}
    @media(hover:hover){.moon-badge:hover .icon-moon{stroke:var(--text)}}
    /* —— 周历：一年一屏，10 个一行，每两行一组 —— */
    #weeks{display:flex;flex-direction:column;gap:12px;width:max-content;margin-inline:auto}
    .wblock{display:flex;flex-direction:column}
    .wrow{display:grid;grid-template-columns:repeat(10,var(--pitch));grid-auto-rows:var(--pitch)}
    .year-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin:0 0 28px}
    #y-label{
      font-size:13px;letter-spacing:.2em;color:var(--text);
      font-variant-numeric:tabular-nums;min-width:64px;text-align:center;
    }
    .cell{
      display:grid;place-items:center;width:var(--pitch);height:var(--pitch);
      border:0;padding:0;background:none;border-radius:6px;cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .dot{
      width:30px;height:30px;background:var(--tone,var(--h0));border-radius:9px;
      transition:transform .14s,background .14s,box-shadow .14s;
    }
    /* 热力色阶：6 级（GitHub 热力图式），档差均匀；颜色随黑白主题反转。
       空格永远同一颜色（--h0）；hover 只在真鼠标设备生效，触屏不残留。 */
    @media(hover:hover){
      .cell:hover .dot{background:var(--hover-dot)}
      .cell.has-record:hover .dot{
        transform:scale(1.12);
        box-shadow:0 0 0 5px rgba(var(--glow),.05);
      }
    }
    .cell.has-record:focus-visible .dot{
      background:#ecece5;transform:scale(1.12);
      box-shadow:0 0 0 5px rgba(var(--glow),.05);
    }
    .cell.future{visibility:hidden}
    .cell.current .dot{outline:1px solid var(--muted);outline-offset:2px}
    .cell.flash .dot{
      background:var(--h6);transform:scale(1.12);
      box-shadow:0 0 0 5px rgba(var(--glow),.06);
      animation:cell-flash .4s ease-out;
    }
    @keyframes cell-flash{
      from{background:var(--flash-from);transform:scale(1.25);box-shadow:0 0 0 8px rgba(var(--glow),.09)}
      to{background:var(--h6);transform:scale(1.12);box-shadow:0 0 0 5px rgba(var(--glow),.06)}
    }
    /* —— 联系：横排、一键直达，克制到只有文字 —— */
    #contacts-list{display:flex;flex-wrap:wrap;gap:6px 28px;justify-content:center}
    .contact-item{font-size:13px;line-height:2;color:var(--secondary)}
    .contact-item a{
      color:var(--secondary);text-decoration:none;display:inline-block;
      transform-origin:left center;transition:transform .15s,color .15s;
    }
    @media(hover:hover){
      .contact-item a:hover{transform:scale(1.02);color:var(--hover-text)}
    }
    .contact-item.off{color:var(--muted);opacity:.55;cursor:default}
    .sec-icon{display:block;margin:0 auto 16px;width:36px;height:auto}
    .sec-icon path{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    /* —— 底部渐糊带 + 聊天悬浮按钮 + 聊天弹窗 —— */
    .page-fade{
      position:fixed;left:0;right:0;bottom:0;height:110px;z-index:12;pointer-events:none;
      backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
      -webkit-mask-image:linear-gradient(to top,#000 25%,transparent);
      mask-image:linear-gradient(to top,#000 25%,transparent);
    }
    .chat-fab{
      position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:13;
      display:flex;align-items:center;justify-content:center;
      width:48px;height:48px;
      background:var(--panel);border:1px solid var(--panel-line);border-radius:50%;
      cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25);
      transition:transform .15s,border-color .15s;
    }
    .chat-fab svg{width:22px;height:auto;stroke:var(--secondary);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    @media(hover:hover){.chat-fab:hover{transform:translateX(-50%) scale(1.04);border-color:var(--muted)}}
    #contact-modal{
      width:min(320px,calc(100% - 36px));border:1px solid var(--panel-line);
      border-radius:16px;background:var(--panel);color:var(--text);padding:0;
    }
    .cm-body{height:252px;display:flex;flex-direction:column;justify-content:center}
    #contact-modal::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    .cm-title{font-size:14px;font-weight:500}
    .cm-tabs{display:flex;gap:6px;background:var(--hover-bg);border-radius:10px;padding:4px;margin:14px 22px 0}
    .cm-tab{flex:1;border:0;background:none;color:var(--secondary);font:inherit;font-size:13px;padding:7px 0;border-radius:8px;cursor:pointer}
    .cm-tab.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
    .cm-body{padding:18px 22px 6px;text-align:center}
    .cm-qr{background:#fff;border-radius:12px;padding:14px;max-width:230px;margin:0 auto}
    .cm-qr img{width:100%;display:block}
    .cm-qr-tip{display:none;font-size:12px;color:#8a8a8a;padding:30px 0}
    .cm-qr.no-qr .cm-qr-tip{display:block}
    .cm-handle{font-size:12px;color:var(--secondary);margin-top:10px}
    .cm-mail{font-size:15px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--panel-line)}
    .cm-note{font-size:12px;color:var(--muted);margin:10px 0 0}
    .cm-greet{font-size:13px;line-height:1.9;color:var(--secondary);text-align:center;margin:10px 0 18px}
    /* —— 周历拙趣线框：3.2px 墨线，8fps 沸腾动画 —— */
    .yearmap{position:relative;padding:36px 26px 32px}
    .frame{
      position:absolute;inset:0;width:100%;height:100%;
      pointer-events:none;
    }
    .frame path{
      fill:none;stroke:var(--frame-ink,#1d1d1d);stroke-width:4;
      stroke-linecap:round;stroke-linejoin:round;
    }
    /* hover 只应答内容行（不放大时间）；放大永远一丢丢；仅限真鼠标设备 */
    .ev{transform-origin:left top}
    .ev p{transition:transform .15s,color .15s}
    @media(hover:hover){
      .ev:hover p{transform:scale(1.02);color:var(--hover-text)}
    }
    .meta{font-size:10px;letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums}
    .detail-photo{width:100%;border-radius:8px;margin-top:12px;display:block}
    .ev+.ev{margin-top:22px}
    .ev p{font-size:13px;line-height:2;color:var(--secondary);margin:6px 0 0}
    /* —— tooltip / 弹窗 —— */
    #tip{
      position:fixed;z-index:20;pointer-events:none;opacity:0;
      background:var(--tip-bg);color:var(--tip-fg);border-radius:10px;padding:7px 11px;
      font-size:10px;line-height:1.5;white-space:nowrap;
      box-shadow:0 14px 40px rgba(0,0,0,.4);
      transition:opacity .12s,transform .12s;transform:translateY(3px);
      font-variant-numeric:tabular-nums;
    }
    #tip.on{opacity:1;transform:none}
    .empty-note{font-size:13px;line-height:2;color:var(--secondary);margin:0}
    .empty-note+.empty-note{margin-top:4px;color:var(--muted)}
    dialog{
      width:min(480px,calc(100% - 36px));max-height:80dvh;padding:0;
      border:1px solid var(--panel-line);border-radius:14px;color:var(--text);
      background:var(--panel);box-shadow:0 30px 100px rgba(0,0,0,.35);scrollbar-width:thin;
    }
    dialog::backdrop{background:#0009}
    .detail-top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 22px 0}
    .close{width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--secondary);font-size:23px;cursor:pointer}
    .close:hover{background:var(--hover-bg)}
    .detail-body{padding:10px 27px 29px}
    .detail-body h2{font-size:18px;line-height:1.7;font-weight:450;margin:0 0 22px}
    .detail-item+.detail-item{margin-top:24px;padding-top:20px;border-top:1px solid var(--panel-line)}
    .detail-item p{font-size:14px;line-height:2;color:var(--secondary);margin:10px 0 0}
    .sr-only{
      position:absolute;width:1px;height:1px;margin:-1px;padding:0;
      overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;
    }
    @media(max-width:700px){
      :root{--pitch:22px}
      .page{padding:56px 22px 64px}
      .dot{width:15px;height:15px;border-radius:5px}
      #weeks{grid-template-columns:repeat(13,var(--pitch))}
      .dot{border-radius:5px}
      section{margin-top:56px}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="who">
      <div class="topline">
        <h1>三禹</h1>
        <a class="navbtn moon-badge" href="admin.html" target="_blank" aria-label="进入编辑" title="编辑">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.6,3.6 C14.4,4.8 17.6,8.5 17.1,13.1 C16.7,17.5 12.9,20.8 8.5,20.5 C6.9,20.4 5.5,19.8 4.2,19 C8,18.5 10.9,15.5 11,12 C11.1,8.8 9.4,5.7 7,4.1 C7.8,3.8 8.8,3.5 9.6,3.6 Z"/>
          </svg>
        </a>
      </div>
      <p id="tagline">致敬，那些，逝去日子</p>
    </header>
    <section class="yearmap" aria-labelledby="map-title">
      <svg class="frame" aria-hidden="true"></svg>
      <h2 id="map-title" class="sr-only">人生周历。一格七天，默认显示一年，可用箭头切换年份。</h2>
      <div class="year-nav">
        <button type="button" class="navbtn" id="y-prev" aria-label="上一年">←</button>
        <span id="y-label" aria-live="polite">2026</span>
        <button type="button" class="navbtn" id="y-next" aria-label="下一年">→</button>
      </div>
      <div id="weeks" role="group" aria-label="人生周历"></div>
      <noscript>启用 JavaScript 后可查看周历。</noscript>
    </section>
    <section class="year-sec" id="year-section" aria-labelledby="year-title">
      <h2 id="year-title">今年</h2>
      <div id="year-list"></div>
    </section>
    <section class="longterm-sec" id="longterm-section" aria-labelledby="longterm-title">
      <h2 id="longterm-title">最近 7 年</h2>
      <div id="longterm-list"></div>
    </section>
    <section class="notes-sec" id="contacts-section" aria-labelledby="contacts-title">
      <h2 id="contacts-title" class="sr-only">联系</h2>
      <svg class="sec-icon" viewBox="0 0 48 36" aria-hidden="true">
        <path d="M5,7 C17,4 33,5 43,6 C45,14 44,24 43,30 C30,33 15,31 5,30 C3,22 4,13 5,7 Z"/>
        <path d="M6,8 C16,16 31,18 42,9"/>
      </svg>
      <div id="contacts-list"></div>
    </section>
  </main>
  <div class="page-fade" aria-hidden="true"></div>
  <button type="button" class="chat-fab" id="chat-open" aria-label="来找我聊聊">
    <svg viewBox="0 0 48 36" aria-hidden="true">
      <path d="M5,7 C17,4 33,5 43,6 C45,14 44,24 43,30 C30,33 15,31 5,30 C3,22 4,13 5,7 Z"/>
      <path d="M6,8 C16,16 31,18 42,9"/>
    </svg>
  </button>
  <dialog id="contact-modal" aria-labelledby="cm-title">
    <div class="detail-top"><span class="cm-title" id="cm-title">来找我聊聊</span><button class="close" id="cm-close" aria-label="关闭">×</button></div>
    <div class="cm-tabs" role="tablist">
      <button type="button" class="cm-tab on" data-tab="wx" role="tab">微信</button>
      <button type="button" class="cm-tab" data-tab="mail" role="tab">邮箱</button>
    </div>
    <div class="cm-body">
      <div class="cm-pane" id="cm-wx">
        <div class="cm-qr" id="cm-qr-box"><div class="cm-qr-tip">二维码待补上</div></div>
        <div class="cm-handle" id="cm-handle">@三禹</div>
      </div>
      <div class="cm-pane" id="cm-mail" hidden>
        <a class="cm-mail" id="cm-mail-link" href="#">…</a>
        <p class="cm-note">点一下就能给我写信</p>
      </div>
    </div>
    <p class="cm-greet">给我一个炸弹<br>让我知道是你</p>
  </dialog>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-top">
      <span class="meta" id="detail-week"></span>
      <button class="close" id="close" aria-label="关闭记录">×</button>
    </div>
    <div class="detail-body"><h2 id="detail-title"></h2><div id="detail-content"></div></div>
  </dialog>
  <script>
    'use strict';
    // —— 内容全部来自 data.js（window.SITE）。没有后端，访客只能看。 ——
    const SITE=window.SITE||{};
    const DAY=86400000,WEEK=7*DAY;
    const [BY,BM,BD]=(SITE.birth||'2002-02-17').split('-').map(Number);
    const BIRTH=Date.UTC(BY,BM-1,BD);
    const now=new Date();
    const TODAY=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
    const lastWeek=Math.max(0,Math.floor((TODAY-BIRTH)/WEEK));
    const $=id=>document.getElementById(id);
    const grid=$('weeks'),dialog=$('detail');
    function formatDate(t){
      const d=new Date(t);
      return `${d.getUTCFullYear()}.${String(d.getUTCMonth()+1).padStart(2,'0')}.${String(d.getUTCDate()).padStart(2,'0')}`;
    }

    // —— 渲染 data.js 里的文案类内容 ——
    function fillLines(el,lines){
      if(!el||!lines?.length)return;
      el.replaceChildren(...lines.flatMap((line,i)=>i
        ?[document.createElement('br'),document.createTextNode(line)]
        :[document.createTextNode(line)]));
    }
    fillLines($('tagline'),SITE.tagline);
    // —— 联系：有一键直达，没有的灰显 ——
    (SITE.contacts||[]).forEach(c=>{
      const row=document.createElement('div');row.className='contact-item';
      if(c.href){
        const a=document.createElement('a');
        a.href=c.href;a.textContent=c.label||'';
        if(!a.href.startsWith('mailto:')){a.target='_blank';a.rel='noopener'}
        row.append(a);
      }else{
        row.classList.add('off');
        row.textContent=c.label||'';
      }
      $('contacts-list').append(row);
    });
    (SITE.longterm||[]).slice(0,7).forEach(t=>{
      const div=document.createElement('div');div.className='ev';
      const m=document.createElement('span');m.className='meta';m.textContent=t.years||'';
      const p=document.createElement('p');
      p.textContent=t.desc?`${t.title}。${t.desc}`:(t.title||'');
      div.append(m,p);
      $('longterm-list').append(div);
    });

    // —— 记录数据解析 ——
    function parseDateValue(value){
      if(/^\d{4}-\d{2}-\d{2}$/.test(value)){
        const [y,m,d]=value.split('-').map(Number);
        const t=Date.UTC(y,m-1,d);
        return {start:t,end:t,label:formatDate(t)};
      }
      if(/^\d{4}-\d{2}$/.test(value)){
        const [y,m]=value.split('-').map(Number);
        return {start:Date.UTC(y,m-1,1),end:Date.UTC(y,m,1)-DAY,label:value.replace('-','.'),span:true};
      }
      return null;
    }
    const records=new Map(),ranks={record:1,important:2,major:3};
    const normalized=[];
    (SITE.records||[]).forEach(r=>{
      if(!r||!r.date||!r.text)return;
      const p=parseDateValue(r.date);
      if(!p)return;
      if(p.end<BIRTH||p.start>TODAY)return;
      p.start=Math.max(p.start,BIRTH);p.end=Math.min(p.end,TODAY);
      p.w0=Math.floor((p.start-BIRTH)/WEEK);p.w1=Math.floor((p.end-BIRTH)/WEEK);
      // 月度记录只亮月初一格，具体内容点击后才出现
      if(p.span)p.w1=p.w0;
      p.level=ranks[r.importance]?r.importance:'record';
      p.freq=Math.max(1,parseInt(r.freq,10)||1);
      p.stage=r.stage===true||r.stage==='true';
      p.text=r.text;p.photo=r.photo||'';
      normalized.push(p);
    });
    normalized.sort((a,b)=>a.start-b.start);
      normalized.forEach(r=>{
      for(let i=r.w0;i<=r.w1;i++){
        if(!records.has(i))records.set(i,[]);
        records.get(i).push({date:r.start,label:r.label,text:r.text,level:r.level,freq:r.freq,photo:r.photo});
      }
    });

    // —— 周历：一年一屏（chunking） ——
    const cellByWeek=new Map();
    const birthYear=new Date(BIRTH).getUTCFullYear();
    const currentYear=new Date(TODAY).getUTCFullYear();
    let viewYear=currentYear;
    // 热度色阶定义在 CSS 变量 --h1…--h6 中，随黑白主题自动反转
    function buildCell(i){
      const entries=records.get(i),cell=document.createElement(entries?'button':'span');
      cell.className='cell';
      const dot=document.createElement('span');
      dot.className='dot';dot.setAttribute('aria-hidden','true');cell.append(dot);
      cell.dataset.week=i;
      if(entries){
        cell.type='button';
        // 热度 = 最高记录的基础分（record1/important2/major3）+ 念头次数加成 + 同周多条加成
        const heat=entries.reduce((max,e)=>{
          const s=(ranks[e.level]||1)+Math.min(3,(e.freq||1)-1);
          return Math.max(max,s);
        },0)+(entries.length>1?1:0);
        cell.style.setProperty('--tone',`var(--h${Math.min(6,Math.max(1,heat))})`);
        cell.classList.add('has-record');
        cell.setAttribute('aria-label',`${formatDate(BIRTH+i*WEEK)}起的一周，${entries.length}条记录`);
      }else cell.setAttribute('aria-hidden','true');
      if(BIRTH+i*WEEK>TODAY)cell.classList.add('future');
      if(i===lastWeek)cell.classList.add('current');
      return cell;
    }
    function renderYear(){
      const cells=[];
      cellByWeek.clear();
      // 每年都渲染完整 52+ 格：当年未到的周也画成空格，框内结构永远一致
      for(let i=0;;i++){
        const start=BIRTH+i*WEEK,y=new Date(start).getUTCFullYear();
        if(y>viewYear)break;
        if(y===viewYear){
          const cell=buildCell(i);
          cellByWeek.set(i,cell);cells.push(cell);
        }
      }
      // 10 个一行，每两行组成一组，组间留距
      const blocks=[];
      for(let i=0;i<cells.length;i+=20){
        const block=document.createElement('div');block.className='wblock';
        const slice=cells.slice(i,i+20);
        for(let r=0;r<slice.length;r+=10){
          const row=document.createElement('div');row.className='wrow';
          row.append(...slice.slice(r,r+10));
          block.append(row);
        }
        blocks.push(block);
      }
      grid.replaceChildren(...blocks);
      $('y-label').textContent=viewYear;
      $('y-prev').disabled=viewYear<=birthYear;
      $('y-next').disabled=viewYear>=currentYear;
    }
    function setViewYear(y){
      y=Math.max(birthYear,Math.min(currentYear,y));
      if(y!==viewYear){viewYear=y;renderYear()}
    }
    $('y-prev').onclick=()=>setViewYear(viewYear-1);
    $('y-next').onclick=()=>setViewYear(viewYear+1);
    renderYear();

    // —— 拙趣线框引擎（移植自 拙趣图案生成器原型.html，他定版的精度与类型）——
    // 重采样 -> 抖动 -> Catmull-Rom 平滑；3.2px 墨线；8fps 沸腾动画（活线）
    const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
    function resample(poly,step,closed){
      const pts=closed?[...poly,poly[0]]:poly,out=[];
      for(let i=0;i<pts.length-1;i++){
        const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
        const k=Math.max(1,Math.round(Math.hypot(x2-x1,y2-y1)/step));
        for(let j=0;j<k;j++)out.push([x1+(x2-x1)*j/k,y1+(y2-y1)*j/k]);
      }
      if(!closed)out.push(pts[pts.length-1]);
      return out;
    }
    function smooth(p,closed){
      const n=p.length,g=i=>closed?p[(i+n)%n]:p[Math.max(0,Math.min(n-1,i))];
      let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
      for(let i=0;i<(closed?n:n-1);i++){
        const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);
        d+=`C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`;
      }
      return d+(closed?'Z':'');
    }
    function wobble(poly,o,r){
      const pts=resample(poly,o.step||14,o.closed).map(([x,y])=>[x+(r()-.5)*2*o.amp,y+(r()-.5)*2*o.amp]);
      return smooth(pts,o.closed);
    }
    const rrect=(cx,cy,w,h)=>{
      return [[-w/2,-h/2],[0,-h/2],[w/2,-h/2],[w/2,0],[w/2,h/2],[0,h/2],[-w/2,h/2],[-w/2,0]]
        .map(([x,y])=>[cx+x,cy+y]);
    };
    let framePath=null,fframe=0,frameTimer;
    function buildFrame(){
      const svg=document.querySelector('.frame');
      if(!svg)return;
      const r=svg.parentElement.getBoundingClientRect();
      const w=Math.max(50,Math.round(r.width)),h=Math.max(50,Math.round(r.height));
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
      const NS='http://www.w3.org/2000/svg';
      const poly=rrect(w/2,h/2,w-16,h-16).map(([x,y])=>[x+8,y+8]);
      const p=document.createElementNS(NS,'path');
      svg.replaceChildren(p);
      framePath={el:p,poly,closed:true};
      paintFrame();
    }
    function paintFrame(){
      if(!framePath)return;
      const r=mulberry(1013+fframe*7919);
      framePath.el.setAttribute('d',wobble(framePath.poly,{amp:0.9,step:18,closed:true},r));
    }
    function startFrameLoop(){
      clearInterval(frameTimer);
      if(matchMedia('(prefers-reduced-motion: reduce)').matches){fframe=0;paintFrame();return}
      frameTimer=setInterval(()=>{fframe++;paintFrame()},1000/8);
    }
    buildFrame();
    startFrameLoop();
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>setTimeout(buildFrame,60));
    let frameT=0;
    window.addEventListener('resize',()=>{clearTimeout(frameT);frameT=setTimeout(()=>{buildFrame();startFrameLoop()},150)});

    // —— 聊天弹窗：微信 / 邮箱两个标签页 ——
    const cmDialog=$('contact-modal');
    $('chat-open').onclick=()=>cmDialog.showModal();
    $('cm-close').onclick=()=>cmDialog.close();
    document.querySelectorAll('.cm-tab').forEach(t=>t.onclick=()=>{
      document.querySelectorAll('.cm-tab').forEach(x=>x.classList.toggle('on',x===t));
      $('cm-wx').hidden=t.dataset.tab!=='wx';
      $('cm-mail').hidden=t.dataset.tab!=='mail';
    });
    if(SITE.wechat?.handle)$('cm-handle').textContent=SITE.wechat.handle;
    if(SITE.wechat?.qr){
      const NS2='http://www.w3.org/2000/svg';
      const img=document.createElement('img');
      img.src='assets/'+SITE.wechat.qr;img.alt='微信二维码';
      $('cm-qr-box').prepend(img);
    }
    if(SITE.email){
      $('cm-mail-link').href='mailto:'+SITE.email;
      $('cm-mail-link').textContent=SITE.email;
    }

    // —— 主题：固定亮色（data-theme="light" 写在 <html> 上）；月亮图标保留作装饰 ——
    localStorage.removeItem('my-life-theme');

    const tip=document.createElement('div');
    tip.id='tip';tip.setAttribute('aria-hidden','true');
    document.body.append(tip);
    grid.addEventListener('mousemove',e=>{
      const cell=e.target.closest('.cell');
      if(!cell?.dataset.week){tip.classList.remove('on');return}
      const i=+cell.dataset.week;
      const count=records.has(i)?` · ${records.get(i).length} records`:'';
      tip.textContent=`WEEK ${i+1} · ${formatDate(BIRTH+i*WEEK)}${count}`;
      tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-12)+'px';
      tip.style.top=Math.min(e.clientY+18,innerHeight-tip.offsetHeight-12)+'px';
      tip.classList.add('on');
    });
    grid.addEventListener('mouseleave',()=>tip.classList.remove('on'));

    // —— 今年：当前年份的记录，上限 7 条 ——
    // 选拔权重（他定的）：P1 念头次数（高频优先）> P2 花的时间（时长）> P3 阶段性 > P4 更近优先；选出后按时间正序展示
    const yearEvents=normalized
      .filter(r=>new Date(r.start).getUTCFullYear()===currentYear)
      .sort((a,b)=>((b.freq||1)-(a.freq||1))
        ||((b.w1-b.w0)-(a.w1-a.w0))
        ||((b.stage?1:0)-(a.stage?1:0))
        ||(b.start-a.start))
      .slice(0,3)
      .sort((a,b)=>a.start-b.start);
    const yearSec=$('year-section');
    if(!yearEvents.length){yearSec.remove()}
    else yearEvents.forEach(r=>{
      const div=document.createElement('div');div.className='ev';
      const m=document.createElement('span');m.className='meta';m.textContent=r.label;
      const p=document.createElement('p');p.textContent=r.text;
      div.append(m,p);
      $('year-list').append(div);
    });

    // —— 周格详情弹窗 ——
    let previousOverflow='';
    function shortDate(t){
      const d=new Date(t);
      return `${String(d.getUTCMonth()+1).padStart(2,'0')}.${String(d.getUTCDate()).padStart(2,'0')}`;
    }
    function openWeek(index){
      const entries=records.get(index);
      const date=BIRTH+index*WEEK;
      // 年份收进 meta 小字；标题只呈现月.日
      $('detail-week').textContent=`WEEK ${index+1} · ${new Date(date).getUTCFullYear()}`;
      $('detail-title').textContent=`${shortDate(date)} — ${shortDate(date+6*DAY)}`;
      const box=$('detail-content');box.replaceChildren();
      if(!entries?.length){
        const p=document.createElement('p');p.className='empty-note';p.textContent='空';
        box.append(p);
      }else{
        [...entries].sort((a,b)=>a.date-b.date).forEach(entry=>{
          const article=document.createElement('article');article.className='detail-item';
          const meta=document.createElement('div');meta.className='meta';meta.textContent=entry.label;
          const p=document.createElement('p');p.textContent=entry.text;
          article.append(meta,p);
          if(entry.photo){
            const img=document.createElement('img');
            img.className='detail-photo';img.src=entry.photo;img.alt='';img.loading='lazy';
            article.append(img);
          }
          box.append(article);
        });
      }
      dialog.showModal();
      tip.classList.remove('on');
      previousOverflow=document.documentElement.style.overflow;
      document.documentElement.style.overflow='hidden';
      dialog.scrollTop=0;
    }
    grid.addEventListener('click',e=>{
      const cell=e.target.closest('[data-week]');
      if(cell)openWeek(Number(cell.dataset.week));
    });
    $('close').onclick=()=>dialog.close();
    dialog.addEventListener('close',()=>{
      document.documentElement.style.overflow=previousOverflow;
    });
    let outsideDown=false;
    function outside(e){
      const r=dialog.getBoundingClientRect();
      return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;
    }
    dialog.addEventListener('pointerdown',e=>{outsideDown=outside(e)});
    dialog.addEventListener('click',e=>{
      if(outsideDown&&outside(e))dialog.close();
      outsideDown=false;
    });
  </script>
</body>
</html>
