<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#f2f2ef">
  <meta name="description" content="三禹的概念地图：能力、项目、概念、人，一张能点的图。">
  <title>三禹 · 概念地图</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23f2f2ef'/%3E%3Cpath%20d='M39,14%20C28,16%2021,26%2022.5,36%20C24,46%2033,52.5%2043,51.5%20C38,48.5%2035,43%2035.2,36.5%20C35.4,29%2038.5,20.5%2043.5,15.5%20C42,14.8%2040.5,14.4%2039,14%20Z'%20fill='none'%20stroke='%231d1d1b'%20stroke-width='3'%20stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:light;
      --bg:#f2f2ef;--text:#121210;--secondary:#3b3b3b;--muted:#8a8a8a;
      --ink:#1d1d1b;--line:rgba(29,29,27,.14);--line-on:rgba(29,29,27,.55);
      --card:#fafaf8;--card-line:#d9d9d4;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    html{background:var(--bg);scrollbar-width:none}
    html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
    body{
      margin:0;overflow:hidden;color:var(--text);
      font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    }
    ::selection{background:#cfcfc8;color:#1d1d1b}
    a{color:inherit}
    #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
    #c.grabbing{cursor:grabbing}
    #c.pointing{cursor:pointer}
    /* —— 顶部 —— */
    .hud{
      position:fixed;top:0;left:50%;transform:translateX(-50%);
      width:min(520px,calc(100% - 44px));padding:26px 0 0;pointer-events:none;z-index:3;
    }
    .hud .top{display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
    h1{font-size:15px;letter-spacing:.14em;font-weight:500;margin:0}
    .back{font-size:15px;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:7px;transition:color .15s,background .15s}
    .back:hover,.back:focus-visible{color:var(--text);background:#e6e6e1}
    .sub{font-size:12px;line-height:1.9;color:var(--secondary);margin:10px 0 0}
    .sub .dim{color:var(--muted)}
    /* —— 底部控件 —— */
    .controls{
      position:fixed;left:50%;transform:translateX(-50%);bottom:0;
      width:min(520px,calc(100% - 44px));padding:0 0 18px;z-index:3;
      display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
    }
    .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
    .chip{
      border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:11px;
      padding:5px 11px;border-radius:99px;cursor:pointer;transition:color .15s,background .15s,border-color .15s;
    }
    .chip:hover{color:var(--text);background:#e6e6e1}
    .chip.on{color:var(--text);border-color:var(--card-line);background:var(--card)}
    .note{font-size:10px;line-height:1.8;color:var(--muted);text-align:center;margin:0;pointer-events:auto}
    .note a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--card-line)}
    .note a:hover{color:var(--text)}
    /* —— 节点面板 —— */
    #panel{
      position:fixed;left:50%;transform:translateX(-50%);bottom:76px;
      width:min(400px,calc(100% - 44px));z-index:4;
      background:var(--card);border:1px solid var(--card-line);border-radius:14px;
      padding:16px 18px 15px;box-shadow:0 18px 50px rgba(0,0,0,.10);
    }
    #panel[hidden]{display:none}
    #panel .p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    #panel h2{font-size:15px;font-weight:500;margin:0;line-height:1.5}
    #panel .x{border:0;background:none;color:var(--muted);font-size:19px;line-height:1;cursor:pointer;padding:0 2px;margin-top:-2px}
    #panel .x:hover{color:var(--text)}
    #panel .meta{font-size:10px;color:var(--muted);letter-spacing:.05em;margin:8px 0 0;font-variant-numeric:tabular-nums}
    #panel p.body{font-size:13px;line-height:1.95;color:var(--secondary);margin:9px 0 0}
    .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    @media(max-width:480px){
      .hud{padding-top:20px}
      #panel{bottom:70px;padding:14px 15px}
    }
  </style>
</head>
<body>
<canvas id="c" aria-label="概念地图，可拖动节点、滚轮缩放、点开看说明"></canvas>

<header class="hud">
  <div class="top">
    <h1>概念地图</h1>
    <a class="back" href="index.html" aria-label="回首页">←</a>
  </div>
  <p class="sub">2021–2026，三千多条记录里反复出现的那些词。<br><span class="dim" id="counts"></span></p>
</header>

<div class="controls">
  <div class="chips" role="group" aria-label="按类型筛选">
    <button class="chip on" data-k="all">全部</button>
    <button class="chip on" data-k="skill">能力</button>
    <button class="chip on" data-k="project">项目</button>
    <button class="chip on" data-k="idea">概念</button>
    <button class="chip on" data-k="person">人</button>
  </div>
  <p class="note">这是收敛过的一张。<a href="about.html">完整档案 →</a> · <a href="admin.html">编辑</a></p>
</div>

<section id="panel" hidden aria-live="polite">
  <div class="p-top"><h2 id="p-title"></h2><button class="x" id="p-close" aria-label="关闭">×</button></div>
  <p class="meta" id="p-meta"></p>
  <p class="body" id="p-body"></p>
</section>

<script src="graph-data.js"></script>
<script>
'use strict';
(function(){
  const G = window.GRAPH || {nodes:[],links:[]};
  const KIND = {skill:"能力", project:"项目", idea:"概念", person:"人"};
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W=0, H=0, dpr=1;

  // —— 建图 ——
  const nodes = G.nodes.map((d,i)=>{
    const a = (i/G.nodes.length)*Math.PI*2;
    const rad = 130 + Math.random()*70;
    return {
      id:d.id, k:d.k||'idea', n:d.n, yr:d.y, info:d.info||'',
      x:Math.cos(a)*rad, y:Math.sin(a)*rad, vx:0, vy:0, deg:0
    };
  });
  const byId = new Map(nodes.map(n=>[n.id,n]));
  const links = [];
  G.links.forEach(([a,b,t])=>{
    const na=byId.get(a), nb=byId.get(b);
    if(!na||!nb||na===nb) return;
    links.push({a:na,b:nb,t:t||''});
    na.deg++; nb.deg++;
  });
  nodes.forEach(n=>{ n.r = 3.4 + Math.sqrt(n.deg)*2.0 + (n.n? Math.min(2.4, Math.log10(n.n)*1.2) : 0); });

  document.getElementById('counts').textContent =
    nodes.length+' 个节点 · '+links.length+' 条连线 · 生成于 '+G.built;

  // —— 视图 ——
  let z=1, panX=0, panY=0;
  let hover=null, selected=null, dragging=null, panning=false;
  let downPt=null, moved=0;
  const hiddenKinds = new Set();

  let ready=false;
  function resize(){
    dpr = Math.min(2, window.devicePixelRatio||1);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    // 版式比例跟着视口走：横屏压扁成椭圆，竖屏拉长填满高度
    const nAY = Math.max(0.55, Math.min(1.8, Math.pow(H/W, 1.1)));
    const changed = Math.abs(nAY - AY) > 0.03;
    AY = nAY;
    if(ready){
      if(changed){ alpha=1; for(let i=0;i<320;i++) step(); alpha=0; }
      fitView();
    }
    draw();
  }
  window.addEventListener('resize', resize);

  // —— 力导向 ——
  // AY：宽屏时把纵向斥力压扁，让整张图自然长成横向的椭圆，而不是挤在中间一个球
  let alpha = 1, AY = 1;
  function step(){
    alpha *= .992;
    const cx=0, cy=0;
    // 斥力
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        let dx=b.x-a.x, dy=(b.y-a.y);
        let d2=dx*dx+dy*dy;
        if(d2<1) { dx=Math.random()-.5; dy=Math.random()-.5; d2=1; }
        const d=Math.sqrt(d2);
        const f = 2600/d2;
        const ux=dx/d, uy=dy/d;
        a.vx-=ux*f; a.vy-=uy*f*AY;
        b.vx+=ux*f; b.vy+=uy*f*AY;
        // 轻微碰撞
        const minD = a.r+b.r+9;
        if(d < minD){
          const push=(minD-d)/d*0.5;
          a.vx-=ux*push; a.vy-=uy*push;
          b.vx+=ux*push; b.vy+=uy*push;
        }
      }
    }
    // 连线
    links.forEach(l=>{
      const dx=l.b.x-l.a.x, dy=l.b.y-l.a.y;
      const d=Math.hypot(dx,dy)||1;
      const L=86 + (l.a.r+l.b.r)*2.2;
      const f=(d-L)*0.010;
      const ux=dx/d, uy=dy/d;
      l.a.vx+=ux*f; l.a.vy+=uy*f;
      l.b.vx-=ux*f; l.b.vy-=uy*f;
    });
    // 向心 + 软边界（防止个别节点被甩出主群） + 阻尼
    const R = 300;
    nodes.forEach(n=>{
      n.vx += (cx-n.x)*0.0045;
      n.vy += (cy-n.y)*0.0045;
      const rr = Math.hypot(n.x,n.y) || 1;
      if(rr > R){
        const over=(rr-R)*0.05;
        n.vx -= (n.x/rr)*over; n.vy -= (n.y/rr)*over*AY;
      }
      if(n===dragging){ n.vx=0; n.vy=0; return; }
      n.vx*=0.86; n.vy*=0.86;
      n.x+=n.vx; n.y+=n.vy;
    });
    return alpha > .004;
  }

  let raf=null;
  function loop(){
    raf=null;
    const alive = step();
    draw();
    if(alive) raf=requestAnimationFrame(loop);
  }
  function kick(a){ alpha=Math.max(alpha,a); if(!raf) raf=requestAnimationFrame(loop); }

  // —— 绘制 ——
  function neighbors(n){
    const s=new Set([n]);
    links.forEach(l=>{ if(l.a===n) s.add(l.b); if(l.b===n) s.add(l.a); });
    return s;
  }
  let lit=null; // 当前高亮集合
  function computeLit(){
    if(selected) lit = neighbors(selected);
    else if(hover) lit = neighbors(hover);
    else lit = null;
  }

  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    computeLit();
    const ox = W/2 + panX, oy = H/2 + panY;
    ctx.setTransform(dpr*z,0,0,dpr*z, dpr*ox, dpr*oy);

    // 连线
    links.forEach(l=>{
      const on = lit ? (lit.has(l.a)&&lit.has(l.b)) : false;
      const vis = !hiddenKinds.has(l.a.k) && !hiddenKinds.has(l.b.k);
      if(!vis) return;
      ctx.beginPath();
      ctx.moveTo(l.a.x,l.a.y); ctx.lineTo(l.b.x,l.b.y);
      ctx.lineWidth = (on?1.5:1)/z;
      ctx.strokeStyle = on ? 'rgba(29,29,27,.5)' : 'rgba(29,29,27,.11)';
      ctx.stroke();
    });

    // 节点
    nodes.forEach(n=>{
      if(hiddenKinds.has(n.k)) return;
      const dim = lit && !lit.has(n);
      const isSel = n===selected, isHov = n===hover;
      const ink = dim ? 'rgba(29,29,27,.15)' : (n.k==='idea' ? '#6e6e6e' : '#1d1d1b');
      const r = n.r * (isSel?1.18:(isHov?1.1:1));
      ctx.beginPath();
      if(n.k==='project'){
        const s=r*1.72;
        roundRect(ctx, n.x-s/2, n.y-s/2, s, s, 3.2);
      }else{
        ctx.arc(n.x,n.y,r,0,Math.PI*2);
      }
      if(n.k==='person'){
        ctx.fillStyle='#f2f2ef'; ctx.fill();
        ctx.lineWidth=1.5/z; ctx.strokeStyle=ink; ctx.stroke();
        ctx.beginPath(); ctx.arc(n.x,n.y,Math.max(1.2,r*0.34),0,Math.PI*2);
        ctx.fillStyle=ink; ctx.fill();
      }else{
        ctx.fillStyle=ink; ctx.fill();
      }
      if(isSel||isHov){
        ctx.beginPath(); ctx.arc(n.x,n.y,r+5/z*1,0,Math.PI*2);
        ctx.lineWidth=1/z; ctx.strokeStyle='rgba(29,29,27,.25)'; ctx.stroke();
      }
    });

    // 标签：屏幕坐标下画，按连接度排序 + 简单避让，避免中间一团字叠在一起
    const ox2 = W/2 + panX, oy2 = H/2 + panY;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font = '400 10px "Inter","PingFang SC",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='top';
    const placed=[];
    const order = nodes.filter(n=>!hiddenKinds.has(n.k)).sort((a,b)=>{
      const pa=(a===selected||a===hover)?1e6:(lit&&lit.has(a)?1e5:0)+a.deg;
      const pb=(b===selected||b===hover)?1e6:(lit&&lit.has(b)?1e5:0)+b.deg;
      return pb-pa;
    });
    order.forEach(n=>{
      const show = n.deg>=3 || (lit&&lit.has(n)) || z>1.35;
      if(!show) return;
      const sx = n.x*z + ox2, sy = n.y*z + oy2 + n.r*z + 4;
      const w = ctx.measureText(n.id).width, h = 12;
      const box = {x:sx-w/2-2, y:sy-1, w:w+4, h:h};
      const clash = placed.some(p=> !(box.x+box.w < p.x || p.x+p.w < box.x || box.y+box.h < p.y || p.y+p.h < box.y));
      if(clash) return;
      placed.push(box);
      const dim = lit && !lit.has(n);
      ctx.fillStyle = dim ? 'rgba(29,29,27,.22)' : (n===selected?'#121210':'#6e6e6e');
      ctx.fillText(n.id, sx, sy);
    });
  }
  function roundRect(c,x,y,w,h,r){
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  // —— 命中 ——
  function toWorld(sx,sy){
    return { x:(sx - W/2 - panX)/z, y:(sy - H/2 - panY)/z };
  }
  function pick(sx,sy){
    const p=toWorld(sx,sy);
    let best=null, bd=1e9;
    nodes.forEach(n=>{
      if(hiddenKinds.has(n.k)) return;
      const d=Math.hypot(p.x-n.x, p.y-n.y);
      const hit = Math.max(n.r+7/z, 12/z);
      if(d<hit && d<bd){ bd=d; best=n; }
    });
    return best;
  }

  // —— 交互 ——
  const pts = new Map();
  let pinch = null;
  canvas.addEventListener('pointerdown', e=>{
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size === 2){
      // 双指：进入捏合，取消单指状态
      const [a,b] = [...pts.values()];
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      pinch = { d: Math.hypot(a.x-b.x, a.y-b.y)||1, z: z, wx: toWorld(mx,my).x, wy: toWorld(mx,my).y };
      dragging=null; panning=false; downPt=null; moved=99;
      canvas.classList.remove('grabbing');
      return;
    }
    if(pts.size > 2) return;
    downPt={x:e.clientX,y:e.clientY}; moved=0;
    const n=pick(e.clientX,e.clientY);
    if(n){ dragging=n; alpha=Math.max(alpha,.35); }
    else { panning=true; canvas.classList.add('grabbing'); }
  });
  canvas.addEventListener('pointermove', e=>{
    if(pts.has(e.pointerId)) pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pts.size>=2){
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y)||1;
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      z = Math.max(.45, Math.min(2.6, pinch.z * (d/pinch.d)));
      panX = mx - W/2 - pinch.wx*z;
      panY = my - H/2 - pinch.wy*z;
      draw(); return;
    }
    if(downPt) moved=Math.max(moved, Math.hypot(e.clientX-downPt.x, e.clientY-downPt.y));
    if(dragging){
      const p=toWorld(e.clientX,e.clientY);
      dragging.x=p.x; dragging.y=p.y;
      dragging.vx=dragging.vy=0;
      kick(.5); return;
    }
    if(panning){
      panX += e.movementX||0; panY += e.movementY||0;
      draw(); return;
    }
    const n=pick(e.clientX,e.clientY);
    if(n!==hover){
      hover=n; draw();
      canvas.classList.toggle('pointing', !!n);
    }
  });
  function endPointer(e){
    pts.delete(e.pointerId);
    if(pts.size < 2) pinch = null;
    canvas.classList.remove('grabbing');
    if(dragging && moved<5) select(dragging);
    if(!dragging && panning && moved<5) closePanel();
    dragging=null; panning=false; downPt=null;
    if(hover) draw();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', ()=>{ hover=null; draw(); });
  canvas.addEventListener('wheel', e=>{
    e.preventDefault();
    const before=toWorld(e.clientX,e.clientY);
    z = Math.max(.45, Math.min(2.6, z * (e.deltaY>0? .9 : 1.1)));
    panX = e.clientX - W/2 - before.x*z;
    panY = e.clientY - H/2 - before.y*z;
    draw();
  }, {passive:false});

  // —— 面板 ——
  const panel=document.getElementById('panel');
  function select(n){
    selected=n; draw();
    document.getElementById('p-title').textContent=n.id;
    const bits=[KIND[n.k]||'概念'];
    if(n.n) bits.push('出现 '+n.n+' 次');
    if(n.yr) bits.push(n.yr);
    bits.push('连出去 '+n.deg+' 条');
    document.getElementById('p-meta').textContent=bits.join(' · ');
    document.getElementById('p-body').textContent=n.info;
    panel.hidden=false;
  }
  function closePanel(){
    selected=null; panel.hidden=true; draw();
  }
  document.getElementById('p-close').onclick=closePanel;
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });

  // —— 筛选 ——
  const KINDS=['skill','project','idea','person'];
  const allChip=document.querySelector('.chip[data-k="all"]');
  function syncAll(){
    allChip.classList.toggle('on', KINDS.every(k=>!hiddenKinds.has(k)));
  }
  document.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=()=>{
      const k=ch.dataset.k;
      if(k==='all'){
        hiddenKinds.clear();
        document.querySelectorAll('.chip[data-k]').forEach(c=>c.classList.add('on'));
      }else{
        if(hiddenKinds.has(k)) hiddenKinds.delete(k); else hiddenKinds.add(k);
        ch.classList.toggle('on', !hiddenKinds.has(k));
      }
      syncAll();
      if(selected && hiddenKinds.has(selected.k)) closePanel();
      draw();
    };
  });

  resize();
  // 先跑稳再画：避免页面加载后图还在飘，也让首帧的取景就是最终取景
  for(let i=0;i<420;i++) step();
  alpha = 0;
  fitView();
  ready = true;
  draw();

  function fitView(){
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    nodes.forEach(n=>{
      x0=Math.min(x0,n.x-n.r-26); x1=Math.max(x1,n.x+n.r+26);
      y0=Math.min(y0,n.y-n.r-20); y1=Math.max(y1,n.y+n.r+20);
    });
    const bw=Math.max(1,x1-x0), bh=Math.max(1,y1-y0);
    z = Math.max(.45, Math.min(1.7, Math.min(W*0.92/bw, H*0.76/bh)));
    panX = -((x0+x1)/2)*z;
    panY = -((y0+y1)/2)*z + H*0.02;
  }
})();
