  <a class="back" href="/index.html">← 回主页</a>
  <h1>AI 营销系统</h1>
  <span class="meta-line">2026.06 · 柳州</span>
  <p class="effect">从 903 份资料里洗出 8257 条真实需求，流水线跑通了一半。</p>
  <div class="sec"><p class="k">怎么做的</p><p>搭了一条 13 环节的流水线：采集、提取、筛选、翻译、映射、选角度、写文案……20 个 AI 员工，一个只干一个动作。外加 FastAPI 文件服务器和中文操作界面。</p></div>
  <div class="sec"><p class="k">做到什么情况</p><p>前半条链路跑通了。发布环节卡住，整个思路后来被内容选题系统继承。</p></div>
  <div class="sec"><p class="k">踩的坑</p><p>卡在发布环节——做完系统才发现，最难的从来不是技术，是敢发。</p></div>
